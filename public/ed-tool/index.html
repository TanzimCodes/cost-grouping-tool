<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cost Grouping Tool</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS (Optional) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

    <style>

    </style>
</head>

<body>



  <!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
    <a class="navbar-brand ms-3" href="#" id="brand-link">
        <img src="../logo.gif" alt="Logo">
        LabVantage
    </a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>

    <!-- The collapse div for navigation links -->
    <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto"> <!-- Changed from ml-auto to ms-auto -->
            <li class="nav-item">
                <a class="nav-link" href="#" id="costExplorerLink">Cost Explorer</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#" id="reportGenerationLink">Report Generation</a>
            </li>
        </ul>
    </div>
</nav>


    <div class="mt-4 p-5 bg-primary text-white rounded text-center mb-4">
        <div class="container">
            <h1 class="display-4">Cost Grouping Tool</h1>
            <p class="lead">Query cost data directly through the AWS API</p>
        </div>
    </div>

    <div class="container">
        <div class="row">
            <!-- First Row: Start Date, End Date, Tag, Linked Account, Region -->
            <div class="col-md-2">
                <label for="start-date" class="form-label">Start Date</label>
                <input type="date" id="start-date" class="form-control" value="2025-01-01">
            </div>
            <div class="col-md-2">
                <label for="end-date" class="form-label">End Date</label>
                <input type="date" id="end-date" class="form-control" value="2025-02-01">
            </div>
            <div class="col-md-2">
                <label for="tag" class="form-label">Dept Tag Value</label>
                <select id="tag" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
            <div class="col-md-2">
                <label for="linked-account" class="form-label">Linked Account</label>
                <select id="linked-account" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
            <div class="col-md-2">
                <label for="region" class="form-label">Region</label>
                <select id="region" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
        </div>

        <div class="row mt-3">
            <!-- Second Row: Group By Dimension, Group By Tag -->
            <div class="col-md-3">
                <label for="group-by-dimension" class="form-label">Group By Dimension</label>
                <select id="group-by-dimension" class="form-select" required>
                    <!-- Options will be added via JS -->
                </select>
            </div>
            <div class="col-md-3">
                <label for="group-by-tag" class="form-label">Group By Tag Type</label>
                <select id="group-by-tag" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
            <div class="col-md-3">
                <label for="group-by-dimension-2" class="form-label">Group By Dimension</label>
                <select id="group-by-dimension-2" class="form-select" required>
                    <!-- Options will be added via JS -->
                </select>
            </div>
            <div class="col-md-3">
                <label for="group-by-tag-2" class="form-label">Group By Tag Type</label>
                <select id="group-by-tag-2" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
        </div>

        <div class="row mt-3">
            <div class="col-md-3">
                <label for="saved-query" class="form-label">Saved Query</label>
                <select id="saved-query" class="form-select">
                    <!-- Options will be added via JS -->
                </select>
            </div>
        </div>


        <!-- <div class="row mt-3">
            <div class="col-12 justify-content-between d-flex">
                <button id="fetch-data" class="btn btn-primary">Fetch Data</button>
                <button id="another-button" class="btn btn-secondary ms-auto">Another Button</button>
            </div>
        </div> -->

        <div class="row mt-3">
            <div class="col-12 d-flex justify-content-between">
                <div class="d-flex justify-content-center w-100">
                    <button id="fetch-data" class="btn btn-primary">Fetch Data</button>
                </div>
                <button id="export" class="btn btn-secondary">Export CSV</button>
            </div>
        </div>




        <!-- Spinner to show during fetch -->
        <div class="d-flex justify-content-center">
            <div id="loading-spinner" class="spinner-border text-primary" role="status" style="display: none;">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <!-- Results Table docker-->
        <!-- <div class="mt-4">
            <div id="tabulator-table"></div> 
        </div> -->
        <div id="myGrid" class="mt-4" style="height:1000px"></div>


        <!-- Toast container for error messages -->
        <div id="toast-container" aria-live="assertive" aria-atomic="true"
            class="position-fixed top-50 start-50 translate-middle p-3">
            <div id="error-toast" class="toast align-items-center text-bg-danger" role="alert" aria-live="assertive"
                aria-atomic="true" data-bs-delay="1000">
                <div class="d-flex">
                    <div class="toast-body">
                        Please select at least one "Group By" option.
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
                        aria-label="Close"></button>
                </div>
            </div>
        </div>

        <!-- Custom CSS for Sticky Header -->
        <style>
            /* Custom CSS for Spinner */
            #loading-spinner {
                display: none;
                /* Initially hidden */
                margin-top: 5px;
            }

            /* Adjust the button to make it clickable */
            #fetch-data {
                position: relative;
                z-index: 10;
                padding: 10px 20px;
                /* Adjust padding to ensure it's clickable */
            }

            .row {
                overflow: visible;
                /* Ensure there is no hidden overflow */
            }
        </style>


        <!-- Bootstrap JS and Custom JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

        <!-- Tabulator CSS -->
        <!-- <link href="https://cdn.jsdelivr.net/npm/tabulator-tables@5.0.7/dist/css/tabulator.min.css" rel="stylesheet"> -->

        <!-- Tabulator JS -->
        <!-- <script type="text/javascript"
            src="https://cdn.jsdelivr.net/npm/tabulator-tables@5.0.7/dist/js/tabulator.min.js"></script> -->

        <!-- AG Grid Styles -->

        <link href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css" rel="stylesheet"> -->

        <!-- AG Grid JS -->
        <!-- <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script> -->
        <script src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise/dist/ag-grid-enterprise.min.js"></script>

        <!-- <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.noStyle.js"></script> -->



        <script src="drop-down.js"></script>
        <script src="script.js"></script>

        <script>
            // Set the href for the links based on the current page
            document.getElementById('costExplorerLink').href = window.location.origin + '/ed-tool/index.html';
            document.getElementById('reportGenerationLink').href = window.location.origin + '/mike-tool/index.html';
            document.getElementById('brand-link').href = window.location.origin + '/index.html';
        </script>

</body>

</html>
