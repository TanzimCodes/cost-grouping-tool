<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSV Parser</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link to the PivotTable.js CSS file -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand ms-3" href="../index.html">
            <img src="../logo.gif" alt="Logo">
            LabVantage
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- The collapse div for navigation links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"> <!-- Changed from ml-auto to ms-auto -->
                <li class="nav-item">
                    <a class="nav-link" href="../ed-tool/index.html">Cost Explorer</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Report Generation</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="mt-4 p-5 bg-primary text-white rounded text-center mb-4">
        <div class="container">
            <h1 class="display-4">Report Generation</h1>
            <p class="lead">Automate Report Generation</p>
            <button id='login' class=" btn btn-dark">Login to IBM manager</button>
        </div>
    </div>

    <div class="container mt-5">

        <div class="row">
            <div class="col-4">
                <label for="fileInput" class="form-label">load Data</label>
                <input type="file" id="fileInput" class="form-control mb-3" accept=".csv">
            </div>

            <div class="col-4">
                <label for="storeFileInpute" class="form-label">Store Previous Data</label>
                <input type="file" id="storeFileInpute" class="form-control mb-3" accept=".csv">
            </div>


            <div class="col-4">
                <label for="fileOptions" class="form-label">Choose Account type</label>
                <select id="fileOptions" class="form-select mb-3">
                    <option value="aws">AWS Account</option>
                    <option value="other">RDS/APP Accounts</option>
                </select>
            </div>

        </div>


        <div class="mt-3">
            <button id="loadOriginalData" class="btn btn-primary">Original Data</button>
            <button id="loadParsedData" class="btn btn-success">Parsed Data</button>
            <button id="loadComparedData" class="btn btn-secondary">Compared Data</button>
        </div>


        <!-- Spinner to show during fetch -->
        <div class="d-flex justify-content-center">
            <div id="loading-spinner" class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="mt-3" id="downloadButtons" style="display: none; text-align: right;">
            <button id="downloadCSV" class="btn btn-info">Download Report</button>
        </div>

        <!-- Starting tab navigation -->
        <ul class="nav nav-tabs mt-3" id="myTabs" role="tablist">
            <li class="nav-item" role="presentation">
                <a class="nav-link active" id="data-tab" data-bs-toggle="tab" href="#data" role="tab"
                    aria-controls="data" aria-selected="true">Data</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="saas-tab" data-bs-toggle="tab" href="#saas" role="tab" aria-controls="saas"
                    aria-selected="false">SAAS</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="hosted-tab" data-bs-toggle="tab" href="#hosted" role="tab"
                    aria-controls="hosted" aria-selected="false">Hosted</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="always-on-tab" data-bs-toggle="tab" href="#always-on" role="tab"
                    aria-controls="always-on" aria-selected="false">Always on</a>
            </li>
        </ul>

        <!-- Tabs Content -->
        <div class="tab-content" id="myTabsContent">
            <!-- Data Table Tab -->
            <div class="tab-pane fade show active" id="data" role="tabpanel" aria-labelledby="data-tab">
                <div class="mt-3">
                    <table id="dataTable" class="table table-bordered">
                        <thead class="table-primary sticky-header">
                            <tr>
                                <!-- Table headers here -->
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data rows will be injected here dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- 'Always on' Tab (This will contain the PivotTable instead of a regular table) -->
            <div class="tab-pane fade" id="always-on" role="tabpanel" aria-labelledby="always-on-tab">
                <div id="pivot-table" class="mt-3"></div>
            </div>
        </div>

        <!-- Custom CSS for Sticky Header -->
        <style>
            .sticky-header {
                position: sticky;
                top: 0;
                /* Stick the header to the top of the page */
                z-index: 1020;
                /* Ensure it stays above other content */
                background-color: #fff;
                /* Background color to make it visible */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                /* Optional: Add shadow for better visibility */
            }

            .grip {
                z-index: 1030;
                /* Ensure the grip is above the sticky header */
                pointer-events: auto;
                /* Ensures the elements are interactive */
            }

            /* Custom CSS for Spinner */
            #loading-spinner {
                display: none;
                /* Initially hidden */
                margin-top: 5px;
            }
        </style>
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!---csv parser-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

        <!-- Pivot table -->
        <!-- Link to jQuery (Required for PivotTable.js) -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- Link to jQuery UI (Required for sortable function in PivotTable.js) -->
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
        <!-- Link to the PivotTable.js library -->
        <script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>
        <!-- --------------- -->

        <!--Custom Script-->
        <script src="global.js"></script>
        <script src="script.js"></script>
        <script src="auth.js"></script>
        <script src="awsAccountFunctions.js"></script>
        <script src="otherAccountFunctions.js"></script>
        <script src="populateTabe.js"></script>
        <script src="utility.js"></script>
        <script src="download.js"></script>
        <script src="addListners.js"></script>

</body>

</html>
