<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Generator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Link to the PivotTable.js CSS file -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.css">

    <!-- Link to the sweetAlert.js CSS file -->

    <link rel="stylesheet" href="../libs/sweetalert2.min.css">


</head>

<body>
    <audio id="warning-sound" src="../audio/silent_hill_siren.mp3" preload="auto"></audio>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <a class="navbar-brand ms-3" href="../index.html">
            <img src="../logo.gif" alt="Logo">
            LabVantage
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- The collapse div for navigation links -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto"> <!-- Changed from ml-auto to ms-auto -->
                <li class="nav-item">
                    <a class="nav-link" href="../ed-tool/index.html">Cost Explorer</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Report Generator</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="mt-4 p-5 bg-primary text-white rounded text-center mb-4">
        <div class="container">
            <h1 class="display-4">Report Generator 2.0</h1>
            <p class="lead">Generate / View your monthly report</p>
            <!-- <button id='login' class=" btn btn-dark">Login to IBM manager</button> -->
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <!-- Upload AWS Administrator File -->
            <div class="col-3">
                <label for="awsFileInput" class="form-label">Upload Administrator File</label>
                <input type="file" id="awsFileInput" class="form-control mb-3" accept=".csv">
            </div>

            <!-- Upload RDS/APP File -->
            <div class="col-3">
                <label for="rdsFileInput" class="form-label">Upload RDS/APP File</label>
                <input type="file" id="rdsFileInput" class="form-control mb-3" accept=".csv">
            </div>

            <!-- Upload None File -->
            <div class="col-3">
                <label for="noneFileInput" class="form-label">Upload None File</label>
                <input type="file" id="noneFileInput" class="form-control mb-3" accept=".csv">
            </div>

            <!-- Upload Previous Data for Comparison -->
            <div class="col-3">
                <label for="previousFileInput" class="form-label">Upload Previous Data for Comparison</label>
                <input type="file" id="previousFileInput" class="form-control mb-3" accept=".csv">
            </div>
        </div>

        <!-- Second Row with Previous Data Upload and Generate Report Button -->
        <div class="row mt-3">

            <!-- Select Month and Year value="2025-01"-->
            <div class="col-3">
                <label for="datePicker" class="form-label">Select Month and Year</label>
                <input type="month" id="datePicker" class="form-control mb-3" value="2025-10">
            </div>

            <!-- Generate Report Button -->
            <div class="col-3">
                <button id="generateReportButton" class="btn btn-danger mt-4">Generate Report</button>
            </div>
        </div>



        <div class="mt-3">
            <!-- <button id="loadAwsParsedData" class="btn btn-success">Parsed Administrator Data</button> -->
            <button id="loadAwsComparedData" class="btn btn-primary">Load Compared Admin Data</button>
            <button id="loadPreviousReport" class="btn btn-secondary">Load Generated Report</button>
        </div>


        <!-- Spinner to show during fetch -->
        <div class="d-flex justify-content-center">
            <div id="loading-spinner" class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div class="mt-3" id="downloadButtons" style="display: none; text-align: right;">
            <button id="saveReport" class="btn btn-success">💾 Save Report</button>
        </div>

        <!-- Bootstrap 5 Theme Mode Toggle Switch -->
        <div class="form-check form-switch mt-3">
            <input class="form-check-input" type="checkbox" id="themeToggle" onchange="toggleTheme()">
            <label class="form-check-label" for="themeToggle">Table Light/Dark</label>
        </div>

        <!-- Starting tab navigation -->
        <ul class="nav nav-tabs mt-3" id="myTabs" role="tablist">
            <!-- Merged Data Tab (Moved to the First Position) -->
            <li class="nav-item" role="presentation">
                <a class="nav-link active" id="merged-data-tab" data-bs-toggle="tab" href="#merged-data" role="tab"
                    aria-controls="merged-data" aria-selected="true">Merged Data</a>
            </li>

            <li class="nav-item" role="presentation">
                <a class="nav-link" id="aws-data-tab" data-bs-toggle="tab" href="#aws-data" role="tab"
                    aria-controls="aws-data" aria-selected="false">Administrator Data</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="rds-app-data-tab" data-bs-toggle="tab" href="#rds-app-data" role="tab"
                    aria-controls="rds-app-data" aria-selected="false">RDS/APP Data</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="none-data-tab" data-bs-toggle="tab" href="#none-data" role="tab"
                    aria-controls="none-data" aria-selected="false">None Data</a>
            </li>

            <li class="nav-item" role="presentation">
                <a class="nav-link" id="saas-tab" data-bs-toggle="tab" href="#saas" role="tab" aria-controls="saas"
                    aria-selected="false">SAAS</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="hosted-tab" data-bs-toggle="tab" href="#hosted" role="tab"
                    aria-controls="hosted" aria-selected="false">Hosted</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="always-on-tab" data-bs-toggle="tab" href="#always-on" role="tab"
                    aria-controls="always-on" aria-selected="false">Always on</a>
            </li>
            <li class="nav-item" role="presentation">
                <a class="nav-link" id="dept-pn-pm-cost-tab" data-bs-toggle="tab" href="#dept-pn-pm-cost" role="tab"
                    aria-controls="dept-pn-pm-cost" aria-selected="false">Dept PN PM Cost</a>
            </li>
        </ul>

        <!-- Tabs Content -->
        <div class="tab-content" id="myTabsContent">

            <!-- New Merged Data Tab Content (Now First) -->
            <div class="tab-pane fade show active" id="merged-data" role="tabpanel" aria-labelledby="merged-data-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="mergedDataTable" class="ag-theme-alpine mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- AWS Data Tab -->
            <div class="tab-pane fade" id="aws-data" role="tabpanel" aria-labelledby="aws-data-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="awsDataTable" class="ag-theme-alpine mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- RDS/APP Data Tab -->
            <div class="tab-pane fade" id="rds-app-data" role="tabpanel" aria-labelledby="rds-app-data-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="rdsAppDataTable" class="ag-theme-alpine mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- None Data Tab -->
            <div class="tab-pane fade" id="none-data" role="tabpanel" aria-labelledby="none-data-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="noneDataTable" class="ag-theme-alpine mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- SAAS Table Tab -->
            <div class="tab-pane fade" id="saas" role="tabpanel" aria-labelledby="saas-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="saasTable" class="mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- Hosted Table Tab -->
            <div class="tab-pane fade" id="hosted" role="tabpanel" aria-labelledby="hosted-tab">
                <div class="mt-3" data-ag-theme-mode="light">
                    <div id="hostedTable" class="mb-5" style="height: 800px; width: 100%;"></div>
                </div>
            </div>

            <!-- 'Always on' Tab (PivotTable) -->
            <div class="tab-pane fade" id="always-on" role="tabpanel" aria-labelledby="always-on-tab">
                <div id="always-on-table" class="mt-3"></div>
            </div>

            <!-- Dept PN PM Cost Tab (PivotTable) -->
            <div class="tab-pane fade" id="dept-pn-pm-cost" role="tabpanel" aria-labelledby="dept-pn-pm-cost-tab">
                <div id="dept-pn-pm-table" class="mt-3"></div>
            </div>
        </div>



        <!-- Custom CSS for Sticky Header -->
        <style>
            .sticky-header {
                position: sticky;
                top: 0;
                /* Stick the header to the top of the page */
                z-index: 1020;
                /* Ensure it stays above other content */
                background-color: #fff;
                /* Background color to make it visible */
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                /* Optional: Add shadow for better visibility */
            }

            .grip {
                z-index: 1030;
                /* Ensure the grip is above the sticky header */
                pointer-events: auto;
                /* Ensures the elements are interactive */
            }

            /* Custom CSS for Spinner */
            #loading-spinner {
                display: none;
                position: fixed;
                /* Makes it out of the normal flow */
                top: 50%;
                /* Centers it vertically */
                left: 50%;
                /* Centers it horizontally */
                /* transform: translate(-50%, -50%); */
                /* Adjusts for exact centering */
                z-index: 9999;
                /* Ensures the spinner is on top of other elements */
            }

            /* Apply to the pivot table container  */
            .pvtRowLabel {
                vertical-align: top !important;
                /* Align row labels vertically at the top */
            }

            .pvtFilterBox {

                position: fixed !important;

                top: 50% !important;
                /* Vertically center the box */
                left: 50% !important;
                /* Horizontally center the box */
                transform: translate(-50%, -50%) !important;
                /* Adjust both axes to perfectly center */
            }

            @keyframes flash {
                0% {
                    background-color: rgba(0, 0, 0, 0.2);
                }

                /* Normal overlay color with lower opacity */
                50% {
                    background-color: rgba(255, 0, 0, 0.8);
                }

                /* Flash to red with less opacity */
                100% {
                    background-color: rgba(0, 0, 0, 0.2);
                }
            }


            .flash {
                animation: flash 1s infinite;
            }

            /* Custom Confirm Button for this specific SweetAlert */
            .my-swal .swal2-confirm {
                background-color: red !important;
                /* Set the background color to red */
                color: white !important;
                /* Set the text color to white */
                border: none !important;
                /* Remove any borders */
            }

            .my-swal .swal2-confirm:hover {
                background-color: darkred !important;
                /* Darker red on hover */
            }
        </style>
        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
        <!---csv parser-->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>

        <!-- Pivot table -->
        <!-- Link to jQuery (Required for PivotTable.js) -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <!-- Link to jQuery UI (Required for sortable function in PivotTable.js) -->
        <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
        <!-- Link to the PivotTable.js library -->
        <script src="https://cdn.jsdelivr.net/npm/pivottable@2.23.0/dist/pivot.min.js"></script>


        <!-- --------------- -->


        <!-- AG Grid JS -->
        <script src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise/dist/ag-grid-enterprise.min.js"></script>

        <!--Custom Script-->
        <script src="pivot-export-renderer.js"></script>

        <script src="global.js"></script>
        <script src="script.js"></script>
        <script src="auth.js"></script>
        <script src="awsAccountFunctions.js"></script>
        <script src="rdsAppAccountFunctions.js"></script>
        <script src="noneAccountFunctions.js"></script>
        <script src="populateTabe.js"></script>
        <script src="utility.js"></script>
        <script src="addListners.js"></script>

        <!--Downloaded lis-->
        <script src="../libs/sweetalert2.all.min.js"></script>
        <script src="../libs/axios.min.js"></script>


</body>

</html>
